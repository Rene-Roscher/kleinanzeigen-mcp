name: Live smoke test

# Detects markup changes on kleinanzeigen.de early. Runs once a week and on demand;
# a failure here means the parser needs an update, not that the code is broken.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest -m live -v
