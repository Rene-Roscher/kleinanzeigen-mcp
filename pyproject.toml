[project]
name = "kleinanzeigen-mcp"
version = "0.1.0"
description = "MCP server + REST API for fresh Kleinanzeigen.de listings – polite, cached, token-protected."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx[http2,socks,brotli,zstd]>=0.28",
    "mcp>=2.3,<3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "selectolax>=1.0",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
kleinanzeigen-mcp = "kleinanzeigen_mcp.__main__:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: hits the real kleinanzeigen.de (deselect with -m 'not live')"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 115
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
